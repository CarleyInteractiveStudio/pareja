<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - AmourApp</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Recuperar acceso</h2>
        <p>Introduce tu correo y te enviaremos instrucciones.</p>
        <br>
        <form id="recoverForm">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="email" required>
            </div>
            <button type="submit">Enviar Instrucciones</button>
        </form>
        <p class="link-text"><a href="login.html">Volver al inicio</a></p>
    </div>
    <script>
        document.getElementById('recoverForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert("Si el correo está registrado, recibirás un enlace de recuperación pronto.");
        });
    </script>
</body>
</html>
