<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Carta - AmourApp</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .truck-animation {
            position: fixed;
            bottom: 50px;
            left: -200px;
            width: 150px;
            z-index: 1000;
            display: none;
        }
        @keyframes drive {
            0% { left: -200px; }
            50% { left: 50%; transform: translateX(-50%); }
            100% { left: 120%; }
        }
        .animate-truck {
            display: block;
            animation: drive 4s ease-in-out forwards;
        }
        .letter-container {
            background: #fff9f9;
            padding: 2rem;
            border: 2px solid #ffccd5;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.1);
        }
    </style>
</head>
<body style="display: block;">
    <nav class="navbar">
        <a href="dashboard.html" style="text-decoration: none; color: var(--primary-color); font-weight: bold;">← Volver</a>
        <span style="font-weight: bold; color: var(--primary-color);">❤️ Escribir Carta</span>
    </nav>

    <div style="padding: 5rem 2rem 2rem;">
        <div class="letter-container card" style="max-width: 600px; margin: auto;">
            <h2>Escribe tu corazón...</h2>
            <div class="form-group">
                <label>Tu mensaje (máx 500)</label>
                <textarea id="letterContent" maxlength="500" style="width: 100%; height: 200px; border: 1px solid #ffccd5; border-radius: 10px; padding: 1rem; resize: none;"></textarea>
                <div id="charCount" style="text-align: right; font-size: 0.8rem; color: #888;">0 / 500</div>
            </div>
            <div class="form-group">
                <label>Enlace de YouTube (Opcional)</label>
                <input type="text" id="ytLink" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <button id="sendLetterBtn">Enviar con el Camioncito 🚚</button>
        </div>
    </div>

    <!-- Animación detallada del camión -->
    <div id="truck" class="truck-animation">
        <svg viewBox="0 0 150 80" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="20" width="100" height="40" fill="#ff4d6d" rx="5"/>
            <rect x="110" y="30" width="30" height="30" fill="#ff758f" rx="5"/>
            <rect x="115" y="35" width="20" height="15" fill="#fff0f3" rx="2"/>
            <circle cx="30" cy="65" r="10" fill="#333"/>
            <circle cx="90" cy="65" r="10" fill="#333"/>
            <path d="M40 30 H80 V50 H40 Z" fill="white" opacity="0.3"/>
            <text x="35" y="45" font-family="Arial" font-size="12" fill="white" font-weight="bold">AMOUR</text>
            <rect x="40" y="10" width="20" height="10" fill="#fff" rx="2" id="letterOnTruck" style="display: none;"/>
        </svg>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const contentArea = document.getElementById('letterContent');
        const charCount = document.getElementById('charCount');
        const sendBtn = document.getElementById('sendLetterBtn');
        const truck = document.getElementById('truck');

        contentArea.addEventListener('input', () => {
            charCount.innerText = `${contentArea.value.length} / 500`;
        });

        sendBtn.addEventListener('click', async () => {
            const content = contentArea.value;
            const ytLink = document.getElementById('ytLink').value;

            if (!content || content.length > 500) {
                alert("La carta debe tener contenido y no pasar los 500 caracteres.");
                return;
            }

            try {
                const res = await fetch('/api/letters/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content, youtubeLink: ytLink })
                });

                if (res.ok) {
                    // Iniciar animación
                    truck.classList.add('animate-truck');
                    document.getElementById('letterOnTruck').style.display = 'block';
                    sendBtn.disabled = true;

                    setTimeout(() => {
                        alert("¡El camión ha entregado tu carta!");
                        window.location.href = 'dashboard.html';
                    }, 4000);
                } else {
                    const data = await res.json();
                    alert(data.message);
                }
            } catch (err) { alert("Error al enviar."); }
        });
    </script>
</body>
</html>
