<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Pareja - AmourApp</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        #chatBox { height: 300px; overflow-y: auto; padding: 1rem; border: 1px solid #ffccd5; border-radius: 10px; margin-bottom: 1rem; display: flex; flex-direction: column; }
        .msg { padding: 0.5rem 1rem; border-radius: 15px; margin-bottom: 0.5rem; max-width: 80%; }
        .msg.sent { background: var(--primary-color); color: white; align-self: flex-end; }
        .msg.received { background: #eee; color: #333; align-self: flex-start; }
        #charCount { font-size: 0.8rem; color: #888; text-align: right; }
    </style>
</head>
<body style="display: block;">
    <nav class="navbar">
        <a href="dashboard.html" style="text-decoration: none; color: var(--primary-color); font-weight: bold;">← Volver</a>
        <span style="font-weight: bold; color: var(--primary-color);">❤️ Nuestro Chat</span>
    </nav>

    <div style="padding: 5rem 2rem 2rem;">
        <div class="card" style="max-width: 600px; margin: auto;">
            <div id="chatBox"></div>
            <div id="charCount">0 / 500</div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                <input type="text" id="messageInput" placeholder="Escribe algo lindo..." maxlength="500">
                <button id="sendBtn" style="width: auto; padding: 0 1.5rem; margin: 0;">Enviar</button>
            </div>
            <button onclick="alert('Regalos Próximamente: Flores, Chocolates y más!')" style="background-color: gold; color: #333; margin-top: 1rem;">🎁 Enviar Regalo</button>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user'));
        const chatBox = document.getElementById('chatBox');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const charCount = document.getElementById('charCount');

        messageInput.addEventListener('input', () => {
            charCount.innerText = `${messageInput.value.length} / 500`;
        });

        async function loadChat() {
            try {
                const res = await fetch('/api/chat/history', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const messages = await res.json();
                chatBox.innerHTML = ''; // Limpiar
                messages.forEach(m => {
                    const div = document.createElement('div');
                    div.className = `msg ${m.sender_id === user.id ? 'sent' : 'received'}`;
                    div.textContent = m.content;
                    chatBox.appendChild(div);
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) { console.error(err); }
        }

        sendBtn.addEventListener('click', async () => {
            const content = messageInput.value;
            if (!content || content.length > 500) return;

            try {
                const res = await fetch('/api/chat/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ content })
                });
                if (res.ok) {
                    messageInput.value = '';
                    charCount.innerText = '0 / 500';
                    loadChat();
                }
            } catch (err) { console.error(err); }
        });

        loadChat();
        setInterval(loadChat, 3000); // Polling simple cada 3s
    </script>
</body>
</html>
